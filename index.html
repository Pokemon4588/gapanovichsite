<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gapanovich</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-bg: #faf9f7;
      --color-text: #1a1a1a;
      --color-accent: #b8a89a;
      --font-main: 'Cormorant Garamond', Georgia, serif;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: var(--font-main);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Fade-in при загрузке */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .container {
      width: min(900px, 100%);
      padding: clamp(28px, 6vw, 60px) clamp(16px, 5vw, 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(20px, 4vw, 32px);
      animation: fadeUp 0.9s ease both;
    }

    /* Логотип-бренд */
    .brand {
      font-size: clamp(11px, 2.2vw, 14px);
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--color-accent);
      animation: fadeUp 0.9s 0.1s ease both;
    }

    /* Разделитель */
    .divider {
      width: clamp(40px, 10vw, 80px);
      height: 1px;
      background: var(--color-accent);
      opacity: 0.6;
    }

    /* Заголовок */
    h1 {
      font-size: clamp(18px, 3.5vw, 28px);
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.4;
      animation: fadeUp 0.9s 0.2s ease both;
    }

    /* Видео */
    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
      animation: fadeUp 0.9s 0.35s ease both;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: none;
    }

    /* Подпись */
    .subtitle {
      font-size: clamp(17px, 3vw, 26px);
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.06em;
      text-align: center;
      animation: fadeUp 0.9s 0.5s ease both;
    }

    /* Нижний декор */
    .footer-line {
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0.45;
      animation: fadeUp 0.9s 0.6s ease both;
    }

    .footer-line span {
      font-size: clamp(9px, 1.8vw, 11px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .footer-line::before,
    .footer-line::after {
      content: '';
      display: block;
      width: clamp(24px, 5vw, 48px);
      height: 1px;
      background: var(--color-text);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="divider"></div>

    <h1>Модный показ бренда «Gapanovich»</h1>

    <div class="video-wrapper">
      <iframe
        src="https://rutube.ru/play/embed/10f582fa4a8a8a883050a99c5ac92e01/?p=-U6RFBFQwRaD0Fr3M9TSUg"
        allow="clipboard-write; autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </div>

    <div class="subtitle">Коллекция «Предчувствие бала»</div>
  </div>

</body>
</html>
